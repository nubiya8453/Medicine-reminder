<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Medicine Reminder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="navbar-brand">
      💊 Medicine Reminder System
    </a>
  </header>

  <main class="main-container">
    <div class="card">
      <h2 class="card-title">Set New Password</h2>
      <p class="card-subtitle">Enter your new password below.</p>

      <div id="alertBox" class="alert"></div>

      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary">Update Password</button>

        <div style="text-align: center; margin-top: 1.2rem;">
          <a href="index.html" style="font-size: 0.9rem; color: var(--primary); text-decoration: none;">← Back to Sign In</a>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; Medicine Reminder System. All rights reserved.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/reset.js"></script>
</body>
</html>
