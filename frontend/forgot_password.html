<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Medicine Reminder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="navbar-brand">
      💊 Medicine Reminder System
    </a>
  </header>

  <main class="main-container">
    <div class="card">
      <h2 class="card-title">Forgot Password</h2>
      <p class="card-subtitle">Enter your registered email to receive a password reset link.</p>

      <div id="alertBox" class="alert"></div>

      <form id="forgotForm">
        <div class="form-group">
          <label for="forgotEmail">Email Address</label>
          <input type="email" id="forgotEmail" class="form-control" placeholder="Enter your email" required>
        </div>

        <button type="submit" class="btn btn-primary">Send Reset Link</button>

        <div style="text-align: center; margin-top: 1.2rem;">
          <a href="index.html" style="font-size: 0.9rem; color: var(--primary); text-decoration: none;">← Back to Sign In</a>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; Medicine Reminder System. All rights reserved.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/reset.js"></script>
</body>
</html>
